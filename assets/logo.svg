<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&amp;family=Montserrat:wght@400;500;600&amp;display=swap');
      .cr-monogram {
        font-family: 'Playfair Display', 'Baskerville', 'Georgia', serif;
        font-style: italic;
        font-weight: 700;
        fill: #F01828;
      }
      .brand-title {
        font-family: 'Montserrat', 'Helvetica Neue', sans-serif;
        font-weight: 500;
        letter-spacing: 0.38em;
        fill: #8E8B8E;
        text-transform: uppercase;
      }
      .brand-subtitle {
        font-family: 'Montserrat', 'Helvetica Neue', sans-serif;
        font-weight: 400;
        letter-spacing: 0.45em;
        fill: #A3A0A3;
        font-size: 11px;
        text-transform: uppercase;
      }
    </style>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F01828" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ornate Flourish Element (Top Crimson Motif) -->
  <g transform="translate(250, 68)" text-anchor="middle">
    <!-- Calligraphic flourish paths -->
    <path d="M-65 -15 C-45 -35 -20 -40 0 -40 C20 -40 45 -35 65 -15 C45 -22 20 -25 0 -25 C-20 -25 -45 -22 -65 -15 Z" fill="#F01828" opacity="0.85" />
    <path d="M-90 10 C-60 -10 -40 -25 -25 -20 C-10 -15 -5 -5 -15 8 C-25 20 -40 15 -35 5 C-30 -2 -22 0 -25 5 C-28 10 -35 12 -38 6 C-42 -3 -35 -12 -22 -15 C-5 -18 5 -5 -5 12 C-15 28 -35 32 -55 25 C-75 18 -85 12 -90 10 Z" fill="#F01828" />
    <path d="M90 10 C60 -10 40 -25 25 -20 C10 -15 5 -5 15 8 C25 20 40 15 35 5 C30 -2 22 0 25 5 C28 10 35 12 38 6 C42 -3 35 -12 22 -15 C5 -18 -5 -5 5 12 C15 28 35 32 55 25 C75 18 85 12 90 10 Z" fill="#F01828" />
    
    <!-- Central Ornamental Monogram 'CR' -->
    <text x="-12" y="22" font-size="78" class="cr-monogram" filter="url(#softGlow)">C</text>
    <text x="22" y="26" font-size="82" class="cr-monogram" filter="url(#softGlow)">R</text>

    <!-- Lower flourish swash -->
    <path d="M-80 30 C-40 46 -15 42 0 38 C15 42 40 46 80 30 C50 48 15 52 0 46 C-15 52 -50 48 -80 30 Z" fill="#F01828" opacity="0.9" />
    <circle cx="0" cy="42" r="2.5" fill="#F01828" />
  </g>

  <!-- Elegant Spaced-out Grey Typography -->
  <text x="250" y="160" text-anchor="middle" font-size="24" class="brand-title">C Ô T E   R Ô T I E</text>
  
  <!-- Subtle Divider -->
  <line x1="170" y1="176" x2="330" y2="176" stroke="#D1CED1" stroke-width="0.8" stroke-dasharray="2 3"/>

  <!-- Subtitle -->
  <text x="250" y="196" text-anchor="middle" class="brand-subtitle">ALLIANCE FRANÇAISE · KARACHI</text>
</svg>
